name: Update prices & deploy

on:
  schedule:
    - cron: "17 3 * * *"        # 每日 03:17 UTC（台北 11:17）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect today's prices
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
        run: python3 scripts/collect.py
      - name: Collect market indices (Computable, Ornn, Silicon Data, manual)
        env:
          ORNN_API_KEY: ${{ secrets.ORNN_API_KEY }}
          SILICONDATA_USERNAME: ${{ secrets.SILICONDATA_USERNAME }}
          SILICONDATA_PASSWORD: ${{ secrets.SILICONDATA_PASSWORD }}
        run: python3 scripts/collect_indices.py --only cgi,ocpi${{ secrets.SILICONDATA_USERNAME != '' && ',sdh' || '' }}
      - name: Commit updated data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json data/indices.json
          git diff --cached --quiet || git commit -m "data: price snapshot $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
